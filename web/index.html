<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<title>RetroLens — 3D Hand Tracking</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px/1.4 system-ui,sans-serif}
#view{position:fixed;inset:0;background:#000}video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}#overlay{pointer-events:none}
#three{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
#top{position:absolute;top:env(safe-area-inset-top,0);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;pointer-events:none}
#status{padding:7px 11px;border-radius:99px;background:#0009;border:1px solid #ffffff35;font-size:12px;backdrop-filter:blur(10px)}
#count{font-size:12px;color:#fff;background:#0009;padding:7px 11px;border-radius:99px;border:1px solid #ffffff35}
#bottom{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0));left:0;right:0;display:flex;justify-content:center;gap:9px;padding:0 12px}
button{border:1px solid #ffffff55;background:#101010d9;color:white;border-radius:999px;padding:12px 17px;font:600 13px system-ui;backdrop-filter:blur(12px);cursor:pointer}
button.primary{background:#fff;color:#000;border-color:#fff}button:disabled{opacity:.45}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff9;background:#0008;border:1px solid #ffffff2b;padding:16px 20px;border-radius:14px;max-width:85%;pointer-events:none}
#hint strong{display:block;color:white;font-size:16px;margin-bottom:5px}
@media(orientation:portrait){video,#overlay,#three{object-fit:cover}}
</style>
</head>
<body>
<div id="view">
  <video id="camera" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="three"></div>
  <div id="top"><span id="status">Kamera belum aktif</span><span id="count">0 / 10 jari</span></div>
  <div id="hint"><strong>3D Hand Tracking</strong>Aktifkan kamera dan tampilkan kedua tangan</div>
  <div id="bottom"><button class="primary" id="start">Aktifkan kamera</button><button id="switch">Ganti kamera</button><button id="stop" disabled>Berhenti</button></div>
</div>
<script type="module">
import {FilesetResolver,HandLandmarker} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const video=document.querySelector('#camera'),statusEl=document.querySelector('#status'),countEl=document.querySelector('#count'),hint=document.querySelector('#hint');
const startBtn=document.querySelector('#start'),stopBtn=document.querySelector('#stop'),switchBtn=document.querySelector('#switch');
const host=document.querySelector('#three');
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x000000,0);host.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera3d=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);
camera3d.position.z=14;
scene.add(new THREE.AmbientLight(0xffffff,1.5));
const light=new THREE.PointLight(0x70eaff,22);light.position.set(0,5,9);scene.add(light);
const bonePairs=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const hands=Array.from({length:2},(_,h)=>{const color=h===0?0x55eaff:0xff75d6,material=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.1,metalness:.25,roughness:.25});const jointGeo=new THREE.SphereGeometry(.095,12,10),joints=Array.from({length:21},()=>{const m=new THREE.Mesh(jointGeo,material);scene.add(m);return m});const boneGeo=new THREE.CylinderGeometry(.035,.035,1,8),bones=bonePairs.map(()=>{const m=new THREE.Mesh(boneGeo,material);scene.add(m);return m});return{joints,bones}});
function resize(){renderer.setSize(innerWidth,innerHeight);camera3d.aspect=innerWidth/innerHeight;camera3d.updateProjectionMatrix()}addEventListener('resize',resize);
function update3d(landmarks){let fingers=0;hands.forEach((hand,h)=>{const lm=landmarks[h];hand.joints.forEach((obj,i)=>{if(!lm){obj.visible=false;return}obj.visible=true;const p=lm[i];obj.position.set((.5-p.x)*12,(.5-p.y)*7.5,-p.z*3);});hand.bones.forEach((obj,i)=>{const pair=bonePairs[i];if(!lm){obj.visible=false;return}obj.visible=true;const a=hand.joints[pair[0]].position,b=hand.joints[pair[1]].position,d=new THREE.Vector3().subVectors(b,a);obj.position.copy(a).add(b).multiplyScalar(.5);obj.scale.set(1,d.length(),1);obj.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize())});if(lm){const tips=[4,8,12,16,20];fingers+=tips.length}});countEl.textContent=(landmarks.length*5)+' / 10 jari';renderer.render(scene,camera3d)}
let landmarker=null,stream=null,running=false,facing='user',lastTime=-1;
async function start(){try{statusEl.textContent='Memuat model…';if(!landmarker){const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.55,minHandPresenceConfidence:.5,minTrackingConfidence:.5})}stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();running=true;startBtn.disabled=true;stopBtn.disabled=false;hint.hidden=true;statusEl.textContent='Mencari tangan…';requestAnimationFrame(loop)}catch(e){statusEl.textContent='Kamera gagal dibuka';alert('Kamera tidak bisa diakses: '+e.message+' Pastikan izin kamera aktif dan situs menggunakan HTTPS.')}} 
function loop(now){if(!running)return;if(video.readyState>=2&&video.currentTime!==lastTime){lastTime=video.currentTime;const result=landmarker.detectForVideo(video,now),lm=result.landmarks||[];update3d(lm);statusEl.textContent=lm.length?lm.length+' tangan terlacak · 3D aktif':'Arahkan tangan ke kamera';hint.hidden=lm.length>0}requestAnimationFrame(loop)}
function stop(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;hands.forEach(hand=>{hand.joints.forEach(x=>x.visible=false);hand.bones.forEach(x=>x.visible=false)});renderer.render(scene,camera3d);startBtn.disabled=false;stopBtn.disabled=true;countEl.textContent='0 / 10 jari';statusEl.textContent='Kamera berhenti';hint.hidden=false}
startBtn.onclick=start;stopBtn.onclick=stop;switchBtn.onclick=async()=>{facing=facing==='user'?'environment':'user';if(running){stop();await start()}};renderer.setAnimationLoop(()=>{if(!running)renderer.render(scene,camera3d)});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
